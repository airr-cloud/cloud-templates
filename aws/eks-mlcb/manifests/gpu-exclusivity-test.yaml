apiVersion: v1
kind: Pod
metadata:
  name: gpu-exclusivity-test-a
  namespace: default
  labels:
    test: gpu-exclusivity
spec:
  tolerations:
    - key: "nvidia.com/gpu"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
  nodeSelector:
    nvidia.com/gpu.present: "true"
  containers:
    - name: holder
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        limits:
          nvidia.com/gpu: 1
---
